# ============================================
# 主配置文件
# ============================================
# 作用：存放公共配置，并通过 profiles.active 决定"当前用哪套模式"。
# 切换方法：把 stdio 改成 sse（或反过来），重启程序即可。
spring:
  application:
    # 项目名
    name: yu-image-search-map
  profiles:
    # 当前激活的配置：stdio（命令行模式）或 sse（网络模式）
    # 激活后，Spring 会自动加载对应的 application-stdio.yml 或 application-sse.yml
    active: sse
server:
  # 端口号，SSE 模式下客户端通过这个端口连接（stdio 模式用不到）
  port: 8127

# ============================================
# Pexels 图片搜索配置
# ============================================
# API Key 不写在代码里，而是从环境变量 PEXELS_API_KEY 读取。
#
# 语法 ${环境变量名:默认值}，冒号后面留空 = 默认值为空。
# Spring 中环境变量的优先级高于配置文件，所以：
#   配了环境变量 → 用环境变量的值
#   没配环境变量 → 用这里的空值（此时启动会直接报错，见 PexelsProperties 的校验）
#
# 不同模式怎么传：
#   - stdio 模式：进程由 MCP 客户端拉起，在客户端配置的 env 字段里写 PEXELS_API_KEY
#   - SSE  模式：服务端自己启动，用系统环境变量（如容器 -e PEXELS_API_KEY=xxx）传入
#   - 本地调试：IDE 的 Run Configuration -> Environment variables
pexels:
  # 图片搜索的 API Key，实际值由环境变量 PEXELS_API_KEY 提供
  api-key: ${PEXELS_API_KEY:}
  # Pexels 图片搜索接口地址
  api-url: https://api.pexels.com/v1/search

